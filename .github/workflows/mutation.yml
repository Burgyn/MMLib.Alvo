name: Mutation

# Mutation testing of the security-relevant logic. Path-filtered so it runs only
# when a mutated project changes. Five targets run in parallel via a matrix:
#   - "security core (expressions)"       → src/MMLib.Alvo/Expressions/**
#                        (stryker-config.expressions.json)
#   - "security core (rules, auth, rest)" → the rest of src/MMLib.Alvo EXCEPT Api/**
#                        (stryker-config.json). See "DECLARED GAP" below for Api/**.
#   - "data-ef"        → the EF provider's PURE-LOGIC only: DestructiveScan,
#                        RenamePrePass, RenameGuessSplitter, DescriptorModelBuilder,
#                        AlvoSqlIdentifier, and the data path's Internal/* composers
#                        (stryker-config.data-ef.json). The EF project's
#                        transaction/DB-round-trip code is deliberately excluded —
#                        its defects only manifest against a real database, so
#                        mutation there is noise; it's covered by the SQLite +
#                        PostgreSQL integration tests instead. Internal/AlvoDataSeed.cs
#                        is excluded for a different reason: it is the test-only
#                        seeding seam, so mutating it measures the harness, not the
#                        product. This target's test-projects list BOTH the EF
#                        package's own tests and MMLib.Alvo.Data.Sqlite.Tests, since
#                        the killing tests for EfAlvoData, SortSqlRenderer,
#                        UpdateSetterFactory and WritePropertyBag live in the latter.
#                        Measured per-config mutant counts, the two Safe-Mode blind
#                        spots and the known survivors are recorded in
#                        docs/architecture/data-path.md ("Mutation-testing notes").
#   - "data-sqlite"    → src/MMLib.Alvo.Data.Sqlite     (stryker-config.data-sqlite.json)
#   - "data-postgresql"→ src/MMLib.Alvo.Data.PostgreSql (stryker-config.data-postgresql.json)
#
# The two driver targets exist because F3 PR2 moved security-relevant RENDERING into
# them: the boolean literal that lands inside a policy WHERE clause (TrueLiteral /
# FalseLiteral), whether an identifier is quoted at all (RenderField / RenderColumn /
# RenderTable), the case-insensitive LIKE shape, and the row-lock clause the WITH CHECK
# pre-image read depends on. Before that they held only registration and plumbing, so
# neither had a config. Mutating `TrueLiteral => "1"` to `"0"` inverts a security
# predicate, and the only other thing pinning those values is an accepted Verify
# baseline — the one artefact that can be made green with no product-code change.
# Each driver's registration surface (the UseXxx builder extensions and its Options
# POCO) is excluded for the same reason AlvoEfCoreProvider.cs is: it is DI wiring,
# proven by the AddAlvo integration tests, and mutating it only produces survivors.
# Both run against the driver's FAST unit test project — MMLib.Alvo.Data.PostgreSql.Tests,
# not the Testcontainers-backed .Tests.Integration project, which self-skips off Linux
# and would make the run depend on Docker.
#
# Each config pins `test-runner: mtp` because Stryker 4.16's default VSTest runner
# cannot discover tests in xUnit v3 / Microsoft.Testing.Platform projects (our primary
# runner — see global.json).
#
# WHY `coverage-analysis: off`, MEASURED rather than assumed. Under the MTP runner
# per-test coverage is not implemented upstream (stryker-net#3516, still open), and
# turning it on is both wrong and pointless. Measured on Stryker 4.16.0 / .NET SDK
# 10.0.100 / xunit.v3 3.2.2, same 90 mutants of src/MMLib.Alvo.Data.Sqlite, same
# machine, same `--concurrency 4`:
#
#   coverage-analysis  tested  Killed  NoCoverage  score     wall clock
#   off                    38      38           0  100.00 %  63 s
#   perTest                33      33           5   86.84 %  59 s
#
# The five extra "NoCoverage" mutants are FALSE: with coverage off the very same
# mutants are Killed. They sit in SqliteCaseSensitiveLike.cs and SqliteSqlDialect.cs
# — the LIKE shape and the dialect rendering this gate exists to protect — and
# because Stryker counts NoCoverage against the score, `perTest` silently reported
# 86.84 % for a suite that actually kills everything. It also bought nothing: 59 s
# vs 63 s, because stryker-net#3750 shows the MTP `runTests` filter is serialised
# under a property the platform server does not bind, so a "filtered" run silently
# executes the whole assembly anyway. Do not re-enable this without re-measuring;
# raw folklore is what this table replaces (it was previously only a sentence in
# commit 2b6b340).
#
# WHY THE RUN HAPPENS FROM `test/` AND NOT THE REPO ROOT. When Stryker is started in
# a directory containing MMLib.Alvo.slnx it enters solution mode and IGNORES each
# config's `test-projects`, running every test project in the solution that
# references the mutated assembly instead. That is not a tuning detail — measured on
# the same commit, `stryker-config.expressions.json` discovered 2211 tests from the
# repo root and 722 from `test/` for an identical 834 mutants, and the 1489 extra
# tests include the Testcontainers-backed .Tests.Integration projects that every
# config deliberately excludes. Since cost is mutants × suite, that alone is the ~3×
# that pushed three shards past their budget on run 30292141967. From `test/` there
# is no solution file, `test-projects` IS honoured (verified: "Analyzing 2 test
# project(s)" for data-ef), and the paths in each config are therefore relative to
# `test/`. The guard in the "Mutation test" step fails the run if it ever slips back
# into solution mode — a silent 3× regression is exactly the kind of thing that
# otherwise only shows up as a timeout months later.
#
# The "Mutation test" step also fails loudly on a vacuous (zero-mutant) run instead
# of reporting a false green (stryker-net#3094).
#
# READ #142 BEFORE TRUSTING A SCORE FROM THIS WORKFLOW. Measured on the same
# versions: this runner reports mutants as Killed that demonstrably survive the
# suite (124/124 "Killed", 100.00 %, for two files no test in the configured test
# project exercises; the same mutation applied by hand fails nothing in 731 tests).
# It is not an always-red suite — with --break-on-initial-test-failure Stryker does
# not abort. Until #142 is understood, a high score here is not evidence, and
# `break: 80` cannot be relied on to fire. The workflow is kept running because the
# cheap legs still exercise the plumbing and a *drop* is still informative; the
# absolute number is not.
#
# DECLARED GAP: src/MMLib.Alvo/Api/** IS NOT UNDER MUTATION TODAY. It is excluded
# from stryker-config.json and stryker-config.api.json has no matrix leg, so nothing
# mutates the Data API's query parsing, authorization filter, idempotency or ETag
# code. This is a deliberate, tracked decision, not an oversight, and it costs
# nothing real:
#   - Judged by MMLib.Alvo.Tests (what stryker-config.json did before Api/** was
#     excluded) the score is an artefact: that project contains no test touching
#     Api/**, yet every mutant came back Killed. That is #142's repro.
#   - Judged by MMLib.Alvo.Api.Tests — the suite that does exercise it, and the one
#     stryker-config.api.json now names — the measured cost is 6.3 s/mutant for
#     1502 mutants: ~2.6 h on a 10-core dev machine, so more than that on a 4-vCPU
#     runner. It cannot produce a verdict inside any budget under GitHub's 6 h
#     ceiling without being sharded several ways.
#   - Sharding it that way is premature while #142 makes the resulting scores
#     untrustworthy, and a leg that always times out is noise, not a gate.
# Run it on demand meanwhile: cd test && dotnet tool run dotnet-stryker
#   -f ../stryker-config.api.json --concurrency 4
#
# WHY POST-MERGE AND NOT ON THE PR: this is the one deliberate exception to the
# repo's "the PR is the only full gate" rule. A mutation run costs ~20 minutes,
# which is a real tax on every PR touching the core, and unlike the other layers
# it does not answer "is this change correct?" — it answers "is the test suite
# still adversarial enough?". That question tolerates being answered minutes
# later, on main, because the fix is to add a test, not to revert the merge.
# Every other layer (contract, snapshot, public-API, arch, integration, e2e)
# stays on the PR. Consequence, accepted: main can go red on mutation score, and
# nothing blocks a merge on it — a failure here is a notification, not a gate.
# The `notify` job below is what makes that notification durable instead of a
# grey X nobody opens. Run it on demand before a risky merge via
# workflow_dispatch.
#
# Note this removes a signal, not a gate: the repo's `main` ruleset requires
# only `Build & test`, `Brief freshness`, `dependency-review` and
# `Analyze (csharp)` — the Stryker contexts were never required, so mutation
# never blocked a merge even while it ran on the PR.
on:
  push:
    branches:
      - main
    paths:
      - 'src/MMLib.Alvo/**'
      - 'src/MMLib.Alvo.Data.EntityFrameworkCore/**'
      - 'src/MMLib.Alvo.Data.Sqlite/**'
      - 'src/MMLib.Alvo.Data.PostgreSql/**'
      - 'stryker-config.json'
      - 'stryker-config.expressions.json'
      - 'stryker-config.api.json'
      - 'stryker-config.data-ef.json'
      - 'stryker-config.data-sqlite.json'
      - 'stryker-config.data-postgresql.json'
      # The test projects belong in the filter too: mutation judges the test
      # suite, so deleting or loosening an adversarial test drops the score
      # without touching src/. Post-merge is now the only run that can catch it.
      - 'test/MMLib.Alvo.Tests/**'
      - 'test/MMLib.Alvo.Data.EntityFrameworkCore.Tests/**'
      - 'test/MMLib.Alvo.Data.Sqlite.Tests/**'
      - 'test/MMLib.Alvo.Data.PostgreSql.Tests/**'
      # And so does the SHIPPED half of those suites, which lives under src/ and
      # not test/: MMLib.Alvo.Testing carries AlvoDataAdversarialTests,
      # AlvoDataStatementTests, AlvoDataDifferentialTests, AlvoDataComparisonTests
      # and AlvoDataOrderingTests, and its relational companion
      # MMLib.Alvo.Testing.EntityFrameworkCore carries AlvoSqlDialectContractTests
      # — the inherited facts that kill mutants in data-ef and in both drivers.
      # Loosening one of those drops the score of three configs, and without these
      # entries it would do so with no workflow run at all: exactly the hole
      # listing the test projects above exists to close. Both halves are listed,
      # because what separates them is a dependency boundary, not a coverage one.
      - 'src/MMLib.Alvo.Testing/**'
      - 'src/MMLib.Alvo.Testing.EntityFrameworkCore/**'
  workflow_dispatch:

permissions:
  contents: read

# Key the group on the COMMIT, not the ref. On main every merge commit deserves
# its own verdict, and a ref-keyed group cannot deliver that even with
# cancel-in-progress off: GitHub keeps at most one pending run per group, so a
# third merge landing during a long run cancels the second one as
# superseded — dropping exactly the commit whose score you needed, as a grey
# "cancelled" nobody reads.
concurrency:
  group: mutation-${{ github.sha }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    # PER-SHARD, ON PURPOSE. A single workflow-wide budget cannot tell "this shard grew"
    # from "this shard was always the expensive one", and a silently rising global number
    # hides the growth curve the timeouts on run 30292141967 made visible. Each leg
    # therefore carries its own `timeout` with the mutant count it was sized against, and
    # the cheap legs keep a tight one so a regression there still trips.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The security core is sharded by `mutate` glob, not because one shard is a
          # meaningful unit, but because wall-clock is this gate's whole cost: with
          # coverage-analysis off every mutant reruns the full test project, so time is
          # mutants × suite. `Expressions/**` in one leg, everything except `Api/**` in the
          # other, and `Api/**` in neither — see DECLARED GAP in the header.
          #
          # `mutants:` below is a MEASURED count (discovery probe, 2026-08-02, at the commit
          # that added this comment), not an estimate — it is what sizes the budget, and it
          # is the number to re-probe when a leg starts timing out. F3's PR3 took
          # stryker-config.json from 478 mutants to 2159; 1502 of those were `Api/**`, and
          # excluding it leaves the 657 measured here.
          - name: security core (expressions)
            config: stryker-config.expressions.json
            project: src/MMLib.Alvo/MMLib.Alvo.csproj
            mutants: 834      # suite: 722 tests
            timeout: 180
          - name: security core (rules, auth, rest)
            config: stryker-config.json
            project: src/MMLib.Alvo/MMLib.Alvo.csproj
            mutants: 657      # suite: 722 tests
            timeout: 120
          - name: data-ef
            config: stryker-config.data-ef.json
            project: src/MMLib.Alvo.Data.EntityFrameworkCore/MMLib.Alvo.Data.EntityFrameworkCore.csproj
            mutants: 596      # suite: 858 tests (two test projects)
            timeout: 120
          - name: data-sqlite
            config: stryker-config.data-sqlite.json
            project: src/MMLib.Alvo.Data.Sqlite/MMLib.Alvo.Data.Sqlite.csproj
            mutants: 38       # suite: 403 tests
            timeout: 60
          - name: data-postgresql
            config: stryker-config.data-postgresql.json
            project: src/MMLib.Alvo.Data.PostgreSql/MMLib.Alvo.Data.PostgreSql.csproj
            mutants: 16       # suite: 101 tests
            timeout: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Guard — mutated project must exist
        id: guard
        run: |
          if [ -f "${{ matrix.project }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Project ${{ matrix.project }} not present — skipping mutation."
          fi

      - name: Restore tools
        if: steps.guard.outputs.run == 'true'
        run: dotnet tool restore

      - name: Mutation test
        if: steps.guard.outputs.run == 'true'
        shell: bash
        # From `test/`, NOT the repo root: with MMLib.Alvo.slnx in the working directory
        # Stryker enters solution mode and ignores each config's `test-projects`, running
        # every test project that references the mutated assembly (measured: 2211 tests
        # instead of 722 for the expressions shard, Testcontainers integration suites
        # included). The header comment has the numbers. Hence `-f ../<config>` too.
        working-directory: test
        run: |
          set -o pipefail
          # --concurrency: Stryker defaults to half the logical cores, i.e. 2 test runners on a
          # GitHub-hosted 4-vCPU runner, leaving half the machine idle for a run whose whole cost
          # is wall-clock. The runner has ~16 GB, comfortably more than four MTP hosts need for
          # this suite. Set on the command line rather than in the config so this reasoning has
          # somewhere to live — the config files are strict JSON with nowhere to put a comment.
          dotnet tool run dotnet-stryker -f "../${{ matrix.config }}" --concurrency 4 2>&1 | tee stryker-output.log
          stryker_exit="${PIPESTATUS[0]}"

          # Fail loud instead of showing a false green: a run that discovered
          # or tested zero mutants is not a passing run, it's a broken one.
          # See stryker-net#3094 — Stryker's VSTest-based runner can regress
          # to this on an xUnit v3 / MTP test project even with `test-runner:
          # mtp` configured (e.g. a tool upgrade, or a new test project that
          # isn't MTP-compatible).
          if grep -qE '0 total mutants will be tested|unable to calculate a mutation score|Number of tests found: 0' stryker-output.log; then
            echo "::error::Mutation run (${{ matrix.name }}) tested zero mutants (vacuous run) — see stryker-output.log above. Failing the gate instead of a false green (stryker-net#3094)."
            exit 1
          fi

          # Fail loud on the OTHER way this gate silently stops measuring what the config
          # says: solution mode. It discards `test-projects`, so the suite quietly becomes
          # every test project referencing the mutated assembly — a ~3x cost increase whose
          # only symptom is a timeout weeks later. If Stryker ever finds a solution file
          # from here again (a stray .slnx under test/, a changed working directory), say so
          # instead of paying for it. Checked after the run so the log is intact above.
          if grep -q 'will mutate solution' stryker-output.log; then
            echo "::error::Mutation run (${{ matrix.name }}) entered Stryker's solution mode, which IGNORES the config's test-projects and silently inflates the suite (see the header comment in this workflow). Fix the working directory rather than the timeout."
            exit 1
          fi

          exit "$stryker_exit"

  # Post-merge, nothing blocks on this workflow, so a failure has to leave a mark
  # somebody trips over. Without this the only signal is GitHub's default email to
  # whoever clicked merge — which is precisely how a quietly-rotting main happens.
  # One open tracking issue at a time: later failures comment on it rather than
  # spawning a pile.
  notify:
    name: Report a failed mutation run
    needs: mutation
    # NOT `failure()`. A job killed by `timeout-minutes` ends with conclusion
    # `cancelled`, so `failure()` is false and this job was SKIPPED for the one
    # outcome that is worse than a low score: a run that produced no verdict at
    # all. That is what happened to run 30292141967 (#98) — three shards hit the
    # 120-minute budget and nobody was told. `always()` plus an explicit result
    # check covers failure, timeout and cancellation alike.
    # Accepted cost: a human cancelling a push-triggered run by hand now also
    # files a report. That is the same "no verdict" state, it is cheap to close,
    # and it is strictly better than a silent timeout. (The concurrency group is
    # keyed on the commit with cancel-in-progress off, so GitHub itself never
    # cancels one of these runs as superseded.)
    if: always() && github.event_name == 'push' && needs.mutation.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # To read this run's PER-LEG job conclusions: `needs.mutation.result`
      # collapses every shard into one word, and the three failure shapes
      # below want telling apart, which needs the individual conclusions.
      actions: read
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.mutation.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # Advisory enrichment only: if the API call fails, the report is still
          # filed — just without the per-shard breakdown. Never let fetching
          # detail be the reason the notification goes missing.
          legs="$(gh api --paginate \
            "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("Stryker (")) | [.conclusion, .name] | @tsv' \
            2>/dev/null || true)"

          legs_md="$(printf '%s\n' "$legs" \
            | awk -F'\t' 'NF==2 && $1!="success" { printf "- `%s` — **%s**\n", $2, $1 }')"

          if [ -z "$legs_md" ]; then
            legs_md="- (per-shard conclusions unavailable; matrix result: \`$MATRIX_RESULT\`)"
          fi

          # Build the report in a FILE, with the heredocs at statement level and
          # the static half quoted (<<'MD'). Not cosmetic: a heredoc nested inside
          # a `$( )` command substitution still has its body scanned for quotes on
          # bash 3.2, so a single apostrophe ("the shard's log") turns the whole
          # step into a syntax error — and this step only ever runs in the failure
          # case, where a syntax error would silence the notification exactly like
          # the bug this job was fixed for. `--body-file` also means backticks need
          # no escaping, so the Markdown below reads as Markdown.
          {
            cat <<EOF
          The post-merge mutation run did not succeed for \`$SHA\` (matrix result:
          \`$MATRIX_RESULT\`).

          Run: $RUN_URL

          Shards that did not succeed:

          $legs_md
          EOF
            cat <<'MD'

          Mutation runs post-merge by design, so this did not block the merge — it
          needs someone to act. There are three shapes, and the right action differs
          per shape; each shard's conclusion above says which one you are looking at.

          - **`failure` — mutation score below threshold.** The adversarial suite
            stopped biting. The fix is to add or strengthen a test, not to revert.
          - **`failure` — vacuous run (zero mutants tested).** The gate itself is
            broken (see stryker-net#3094); the shard's log carries an `::error::`
            annotation naming it. More urgent than a low score: it means the
            previous greens were meaningless. Open the log to tell this apart from
            a below-threshold failure.
          - **`cancelled` / `timed_out` — no verdict produced.** The shard hit
            `timeout-minutes`, so there is no score at all, and nothing here says
            the suite got worse. What needs looking at is the run's cost and its
            budget — not the tests.
          MD
          } > mutation-report.md

          # The label may not exist yet; creating it must not fail the job.
          gh label create mutation-gate \
            --repo "$REPO" \
            --description "Post-merge mutation run needs attention" \
            --color B60205 2>/dev/null || true

          existing="$(gh issue list --repo "$REPO" --state open \
            --label mutation-gate --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file mutation-report.md
          else
            gh issue create --repo "$REPO" \
              --title "Mutation gate failed on main" \
              --label mutation-gate \
              --body-file mutation-report.md
          fi
