name: Mutation

# Mutation testing of the security-relevant logic. Path-filtered so it runs only
# when a mutated project changes. Seven targets run in parallel via a matrix, the
# canary first (see THE CANARY below):
#   - "security core (expressions)"       → src/MMLib.Alvo/Expressions/**
#                        (stryker-config.expressions.json)
#   - "security core (rules, auth, rest)" → the rest of src/MMLib.Alvo EXCEPT Api/**
#                        (stryker-config.json). See "DECLARED GAP" below for Api/**.
#   - "data-ef-core"   → every mutated file whose killers CANNOT be shown to live in
#                        MMLib.Alvo.Data.EntityFrameworkCore.Tests
#                        (stryker-config.data-ef-core.json). This is the ONLY leg that
#                        pays for two test assemblies, and that is the whole point of
#                        the split — see "WHY data-ef IS TWO LEGS" below for the rule
#                        that decides membership and for what it cannot prove.
#   - "data-ef-rest"   → the remainder: DestructiveScan, DescriptorModelBuilder,
#                        AlvoSqlIdentifier, the SQL renderers, the guards and the rest
#                        of Internal/* (stryker-config.data-ef-rest.json), against
#                        MMLib.Alvo.Data.EntityFrameworkCore.Tests ALONE.
#                        Both legs exclude the same files the single leg did: the EF
#                        project's transaction/DB-round-trip code, because its defects
#                        only manifest against a real database, so mutation there is
#                        noise and the SQLite + PostgreSQL integration tests cover it;
#                        and Internal/AlvoDataSeed.cs, for a different reason — it is
#                        the test-only seeding seam, so mutating it measures the
#                        harness, not the product.
#                        Measured per-config mutant counts, the two Safe-Mode blind
#                        spots and the known survivors are recorded in
#                        docs/architecture/data-path.md ("Mutation-testing notes").
#   - "data-sqlite"    → src/MMLib.Alvo.Data.Sqlite     (stryker-config.data-sqlite.json)
#   - "data-postgresql"→ src/MMLib.Alvo.Data.PostgreSql (stryker-config.data-postgresql.json)
#
# The two driver targets exist because F3 PR2 moved security-relevant RENDERING into
# them: the boolean literal that lands inside a policy WHERE clause (TrueLiteral /
# FalseLiteral), whether an identifier is quoted at all (RenderField / RenderColumn /
# RenderTable), the case-insensitive LIKE shape, and the row-lock clause the WITH CHECK
# pre-image read depends on. Before that they held only registration and plumbing, so
# neither had a config. Mutating `TrueLiteral => "1"` to `"0"` inverts a security
# predicate, and the only other thing pinning those values is an accepted Verify
# baseline — the one artefact that can be made green with no product-code change.
# Each driver's registration surface (the UseXxx builder extensions and its Options
# POCO) is excluded for the same reason AlvoEfCoreProvider.cs is: it is DI wiring,
# proven by the AddAlvo integration tests, and mutating it only produces survivors.
# Both run against the driver's FAST unit test project — MMLib.Alvo.Data.PostgreSql.Tests,
# not the Testcontainers-backed .Tests.Integration project, which self-skips off Linux
# and would make the run depend on Docker.
#
# Each config pins `test-runner: mtp` because Stryker 4.16's default VSTest runner
# cannot discover tests in xUnit v3 / Microsoft.Testing.Platform projects (our primary
# runner — see global.json).
#
# WHY `coverage-analysis: off`, MEASURED rather than assumed. Under the MTP runner
# per-test coverage is not implemented upstream (stryker-net#3516, still open), and
# turning it on is both wrong and pointless. Measured on Stryker 4.16.0 / .NET SDK
# 10.0.100 / xunit.v3 3.2.2, same 90 mutants of src/MMLib.Alvo.Data.Sqlite, same
# machine, same `--concurrency 4`:
#
#   coverage-analysis  tested  Killed  NoCoverage  score     wall clock
#   off                    38      38           0  100.00 %  63 s
#   perTest                33      33           5   86.84 %  59 s
#
# The five extra "NoCoverage" mutants are FALSE: with coverage off the very same
# mutants are Killed. They sit in SqliteCaseSensitiveLike.cs and SqliteSqlDialect.cs
# — the LIKE shape and the dialect rendering this gate exists to protect — and
# because Stryker counts NoCoverage against the score, `perTest` silently reported
# 86.84 % for a suite that actually kills everything. It also bought nothing: 59 s
# vs 63 s, because stryker-net#3750 shows the MTP `runTests` filter is serialised
# under a property the platform server does not bind, so a "filtered" run silently
# executes the whole assembly anyway. Do not re-enable this without re-measuring;
# raw folklore is what this table replaces (it was previously only a sentence in
# commit 2b6b340).
#
# CAVEAT ADDED 2026-09-14: the `off` row above was measured THROUGH #142, so its
# `38 Killed / 100.00 %` is the artefact, not a result — which also undercuts the
# sentence "with coverage off the very same mutants are Killed". The `perTest`
# conclusion probably survives, because `NoCoverage` is a discovery fact rather than a
# kill count, and the wall-clock comparison certainly does. Re-measured post-fix on the
# current file set, `off` gives 44 tested / 29 Killed / 1 Survived / 14 Timeout,
# 97.73 % (local, under load). `perTest` has NOT been re-measured. Treat the decision as
# standing on stryker-net#3516 and #3750 rather than on this table until it is.
#
# WHY THE RUN HAPPENS FROM `test/` AND NOT THE REPO ROOT. When Stryker is started in
# a directory containing MMLib.Alvo.slnx it enters solution mode and IGNORES each
# config's `test-projects`, running every test project in the solution that
# references the mutated assembly instead. That is not a tuning detail — measured on
# the same commit, `stryker-config.expressions.json` discovered 2211 tests from the
# repo root and 722 from `test/` for an identical 834 mutants, and the 1489 extra
# tests include the Testcontainers-backed .Tests.Integration projects that every
# config deliberately excludes. Since cost is mutants × suite, that alone is the ~3×
# that pushed three shards past their budget on run 30292141967. From `test/` there
# is no solution file, `test-projects` IS honoured (verified: "Analyzing 2 test
# project(s)" for data-ef), and the paths in each config are therefore relative to
# `test/`. Measured for data-ef too, the shard whose 10-minute run became a
# >120-minute timeout with no config change: 858 tests from `test/`, 1489 from the
# repo root, 596 mutants either way.
#
# scripts/assert-mutation-run enforces all of that after every shard, and its header is
# where the reasoning lives. It asserts POSITIVELY — the run must not be vacuous, must
# report the number of test projects the config declares, and must not have lost 40 % of
# either its mutants or its suite — because the first version of the solution-mode check
# was a negative `grep -q 'will mutate solution'`, which fails OPEN the moment a Stryker
# release rewords that line. Note especially why the solution-mode check is the
# TEST-PROJECT count and not the mutant count: solution mode leaves the mutant count
# untouched (834 and 834, 596 and 596 above) and moves only the suite. The `mutants:` and
# `suite:` values in the matrix are what those two floors are measured against.
# scripts/test-assert-mutation-run runs the whole thing over real logs from both modes.
#
# #142 IS CLOSED, AND WHAT IT WAS IS WORTH KEEPING HERE. Every score this workflow
# published before 2026-09-14 was inflated, most of them to 100 %, and the cause was
# not Stryker's arithmetic: it was two of OUR tests erroring for reasons that had
# nothing to do with the mutant, in a way only a mutation run can produce.
#
#   Stryker's MTP runner keeps ONE test-server process alive across mutants and re-runs
#   the whole assembly in it once per mutant. Two things in our suites are only correct
#   the first time a process runs them:
#     - Verify's PrefixUnique guard remembers every snapshot prefix the PROCESS has
#       verified, so from the second mutant on every Verify-based test throws
#       "The prefix has already been used: …";
#     - the public-API approval gate reads the MUTATED assembly with Mono.Cecil, whose
#       PDB no longer matches the rewritten IL — "SymbolsNotMatchingException".
#   xUnit reports both as an MTP ErrorTestNodeStateProperty, Stryker counts an errored
#   node as a failing test, and the mutant is recorded Killed. Every mutant.
#
# THAT IS ALSO WHY THE INVESTIGATION TOOK THREE ROUNDS TO LAND, and the two wrong turns
# are the reason this paragraph exists. The FIRST mutant of a run is clean — fresh
# process, empty prefix set, and Stryker's initial test run passes — so
# `--break-on-initial-test-failure` never fires and the approval gate looked ruled out.
# And Stryker's trace line prints one node's state next to the FOLLOWING node's name,
# so the blame landed on whichever innocent test was reported after the Verify test,
# which changed from run to run and read exactly like flakiness (#222 named three such
# tests; none of them was ever at fault). The fix is test-only and gated on
# STRYKER_MUTANT_FILE: test/_shared/mutation/ carries it.
#
#   config                                   before        after
#   stryker-config.canary.json (13 mutants)   9 Killed /  4 Survived   0 / 13   0.00 %
#   #142's own repro (182 mutants, Api/**)  182 Killed /  0 Survived   0 / 182  0.00 %
#
# Both "after" numbers are the honest answer by construction: neither suite can reach
# the mutated code. Scores recorded before that date are not comparable with scores
# after it — every one of them was measured through this defect.
#
# THE CANARY is this gate's instrument for the one failure no count can see: a run that
# measures exactly the right thing and LIES about the result. stryker-config.canary.json
# mutates src/MMLib.Alvo.Testing/Migrations/InMemoryDescriptorVersionStore.cs against
# test/MMLib.Alvo.Abstractions.Tests — a suite that mentions neither that class nor
# DescriptorVersion at all — so every one of its mutants is known-surviving by
# construction, and `scripts/assert-mutation-run <log> <config> 13 142 canary canary`
# (check 5) refuses any run that reports a kill. The check is ONE-SIDED on purpose: a
# reported kill is always a lie, whatever caused it, while an all-survived canary might
# be luck — which is the direction a guard may be generous in.
#
# IT HAS EARNED ITS KEEP THREE TIMES. It verified Dependabot's Stryker 5.0.0 bump (#220)
# in 17 seconds — identical verdict, so the upgrade fixes nothing and was held; 5.0's
# trace run against it is what first named the erroring tests; and it is what proved the
# fix above, in seconds, on a defect whose real repro costs 8 minutes.
#
# IT IS NOW THE FIRST LEG IN THE MATRIX, which is what the previous version of this
# comment handed over as the decision to take the day #142 cleared. It is first because
# it is the only leg whose answer is known in advance: if the canary reports a kill, no
# other leg's number on that run is evidence, whatever it says. `timeout: 5` against a
# run measured at ~20 s locally — the margin is for checkout and restore, not for the
# run. STRYKER_MUTANT_FILE is an undocumented Stryker internal, so if a release renames
# it the gates in test/_shared/mutation/ silently stop applying; the canary going red is
# exactly how that surfaces. Run it by hand any time:
#   cd test && dotnet tool run dotnet-stryker -f ../stryker-config.canary.json --concurrency 4
#
# It exits 0 at 0.00 %, which is the one thing a leg scoring zero has to get right:
# stryker-config.canary.json declares no `thresholds`, so Stryker's default `break: 0`
# applies and nothing is below it. Verified end to end — Stryker exit 0, and
# `scripts/assert-mutation-run … canary canary` prints "CANARY honest".
#
# EXPECT THE FIRST HONEST RUN TO GO RED, ON SEVERAL LEGS AT ONCE. Every score-bearing
# config carries `break: 80` and every one of them has been passing on a false ~100 %.
# The one leg measured locally after the fix, `data-postgresql`, comes back
# 15 Killed / 5 Survived — 75.00 %, below its own break. That is five real survivors and
# a test debt, not a regression this commit introduced, and the thresholds are
# deliberately left alone: lowering them to match the first honest measurement would
# rebuild the lying gate by a slower route. `data-sqlite` measured 97.73 % locally
# (29 Killed / 1 Survived / 14 Timeout, under load — the timeouts want the CI run to
# confirm). `expressions`, `rules/auth/rest`, `data-ef-core` and `data-ef-rest` are
# unmeasured post-fix. scripts/mutation-notify titles the tracking issue with the merge
# commit's sha, so read the first few as recalibration rather than as that commit's
# doing.
#
# WHAT THE CANARY DOES NOT PROVE. It exercises MMLib.Alvo.Abstractions.Tests, and #142's
# own repro exercised MMLib.Alvo.Tests. The evidence that the data suites are honest too
# is indirect but real: a poisoned leg reports 100 %, and neither driver leg measured
# above does. MMLib.Alvo.Data.EntityFrameworkCore.Tests has not been measured post-fix at
# all — the leg that runs it is the 60-minute one. Its first post-merge score is the
# measurement.
#
# DECLARED GAP: src/MMLib.Alvo/Api/** IS NOT UNDER MUTATION TODAY. It is excluded
# from stryker-config.json and stryker-config.api.json has no matrix leg, so nothing
# mutates the Data API's query parsing, authorization filter, idempotency or ETag
# code. This is a deliberate, tracked decision, not an oversight, and it costs
# nothing real:
#   - Judged by MMLib.Alvo.Tests (what stryker-config.json did before Api/** was
#     excluded) the score is an artefact: that project contains no test touching
#     Api/**, yet every mutant came back Killed. That is #142's repro.
#   - Judged by MMLib.Alvo.Api.Tests — the suite that does exercise it, and the one
#     stryker-config.api.json now names — the measured cost is 6.3 s/mutant for
#     1502 mutants: ~2.6 h on a 10-core dev machine, so more than that on a 4-vCPU
#     runner. It cannot produce a verdict inside any budget under GitHub's 6 h
#     ceiling without being sharded several ways.
#   - A leg that always times out is noise, not a gate. This used to read "premature
#     while #142 makes the resulting scores untrustworthy"; that half is spent — #142
#     is closed — and what remains is purely the budget, so #143 is now a scheduling
#     question rather than one waiting on anything.
# TRACKED IN #143, which is where the re-shard checklist lives — this comment is not the
# work item, because #99 closes with this change and #142 is about the Killed artefact.
# Run it on demand meanwhile: cd test && dotnet tool run dotnet-stryker
#   -f ../stryker-config.api.json --concurrency 4
#
# WHY data-ef IS TWO LEGS, AND WHY IT IS SPLIT BY *TEST PROJECT* RATHER THAN BY FILE.
# The single data-ef leg was killed by `timeout-minutes: 120` on three consecutive main
# commits (#205), and every shard's declared counts had gone stale. Re-probed
# 2026-09-10, discovery only, from `test/`:
#
#   shard                 mutants: declared -> now    suite: declared -> now
#   expressions                  834 ->  900                 722 -> 1185
#   rules, auth, rest            657 -> 1638                 722 -> 1185
#   data-ef (single leg)         596 -> 1108                 858 -> 1135
#   data-sqlite                   38 ->   44                 403 ->  581
#   data-postgresql               16 ->   20                 101 ->  110
#
# So data-ef was running 1108 mutants against a budget sized for 596. Note check 3's
# floor is ONE-SIDED by design — growth never fails a run — which is why nothing
# reported this before the timeout did. Re-probe ALL of them when one times out.
#
# THE MODEL THAT ACTUALLY PREDICTS THE COST IS NOT mutants x test COUNT. Measured on
# run 33593316805 — the last data-ef leg that SUCCEEDED: 888 mutants, mutation loop
# 05:07:41 -> 06:37:31, so 90 min x 4 runners / 888 = **24.3 s per mutant**, against
# ~6.2 s for rules/auth/rest (1185 tests, ONE assembly). Four times the cost at the
# same test count, because each mutant run restarts every test server it uses and
# MMLib.Alvo.Data.Sqlite.Tests stands up real databases per test. The lever is
# therefore "how many test assemblies does a leg pay for", not "how many files does it
# mutate". (That same run printed `Killed: 888 / Survived: 0 / 100.00 %`, which is #142
# on display — one of ours erroring on every run after a process's first, not 888 real
# kills. Re-measure that leg before quoting its score anywhere.)
#
# That is why the split #205 proposes — the five migration classes on one leg, the data
# path on the other — was PROBED AND REJECTED. It divides the mutants 133/975, so the
# data-path leg keeps 88 % of them AND both assemblies: ~106 min, still on the edge.
#
# THE RULE THAT DECIDES MEMBERSHIP, and it is conservative on purpose. A file goes on
# `data-ef-core` (both assemblies) unless MMLib.Alvo.Data.EntityFrameworkCore.Tests can
# be SHOWN to hold its killers. Two kinds of showing count: the test project references
# the type by name in source, or a design doc attributes it explicitly. Everything else
# — a file reached only behaviourally through IAlvoData/ISchemaMigrator, so no test
# names it — goes on core. That is why ConstraintViolationTranslator, BatchWrite,
# WholeRowGuard, RenamePrePass, RenameGuessSplitter, AlvoModelCacheKeyFactory and
# UpdateSetterFactory are on core despite not being "data path", and why the three
# outbox files are too: docs/architecture/events.md attributes their killers to
# SqliteOutboxTableTests / SqliteOutboxStoreTests / SqliteAlvoDataOutboxTests.
#
#   data-ef-core   543 mutants x 2 assemblies (1135 tests)  24.3 s/mutant -> ~55 min
#   data-ef-rest   565 mutants x 1 assembly  ( 554 tests)   <=24.3 s      -> <=57 min
#
# 543 + 565 = 1108: same files, same mutant set, and the arithmetic is the proof.
# `data-ef-rest`'s figure is an UPPER BOUND at the two-assembly rate, deliberately: the
# reduction from dropping the second assembly is real but was not measured, and an
# estimate that assumes it would be the unstated assumption this comment exists to
# avoid. Both legs therefore keep the 120-minute budget the single one had, which
# covers the bound with room, and the first post-merge run is the measurement.
#
# WHAT THE SPLIT DOES NOT PROVE, stated because it is the cost. 543 + 565 = 1108
# preserves the MUTANT set; it does not preserve each mutant's SCORE DOMAIN, because a
# score is (file x suite) and the suite changed for the 565 on `data-ef-rest`. If any
# of those killers does live in Sqlite.Tests after all, that mutant becomes a survivor
# with no product change. #142 masked exactly that — it produced false KILLS — and THIS
# IS THE COMMIT THAT CLEARS IT, so `data-ef-rest` is where a wave of survivors may appear
# on the very next run, and misreading them as weak tests rather than as a misplaced file
# is the live risk rather than a future one. The rule above is the mitigation, not a
# proof, and the adjudicator is
# stryker-config.data-ef.json: re-run the whole shard and any mutant that survives on
# `rest` but is killed there is a misplaced file, not a missing test.
#
# TWO ONE-LINE LEVERS, BOTH PROBED, NEITHER APPLIED:
#   - `ignore-methods: ["*Log*", "ThrowIfNull*"]` removes 96 of 1108 mutants (8.7 %).
#     Not a lever; the cost is not in the guards.
#   - `mutation-level: "Basic"` removes 694 of 1108 (63 %). A real cut, and a different
#     measurement rather than a cheaper one: it drops the Standard mutators, so the
#     score is no longer comparable to any other leg's. Changing the score domain in
#     the same commit that re-partitions it is what #99 warned against; if the budget
#     is ever the binding constraint again, this is the next decision to take
#     deliberately.
#
# BUDGETS ARE NOW SIZED FROM MEASURED WALL CLOCK, not from mutant counts. expressions
# went 180 -> 90 (measured 27-31 min twice) and the two drivers 60 -> 30 (7 min and
# 2 min) — a budget six times the measured time hides the growth curve the per-shard
# budgets exist to expose, and expressions held 180 minutes and used 29. The drivers
# keep 30 rather than 10 for a different reason than the rule: on a 2-minute leg the
# fixed checkout/restore overhead dominates, so a tighter floor would measure the
# runner rather than the shard. rules/auth/rest keeps 120 against a measured 41-47 min:
# it grew 149 % in mutants since its last calibration and is the next leg to run out.
# A too-TIGHT budget has the worse failure mode, and that asymmetry is why nothing here
# is cut below ~2x: a cancelled shard never reaches its log-upload step, so there is
# neither a score nor a log to read.
#
# stryker-config.data-ef.json STAYS, and it is NOT orphaned. scripts/test-assert-mutation-run
# reads its `test-projects` on every PR (ci.yml's `Script suites` job), so deleting it
# reddens the PR gate; it is the only config with committed logs captured from both a
# scoped and a solution-mode run, which is what exercises the guard's real-regression
# branch; and it is the adjudicator for the blind spot above. That suite also asserts it
# stays the exact union of the two legs — nothing else would, and the rot direction is
# silent (forgetting data-ef-rest.json fails a leg loudly, forgetting data-ef.json fails
# nothing). It is deliberately NOT in the `paths:` filter below, on api.json's
# precedent: no leg reads it, so a change to it would start a multi-hour run that cannot
# exercise it.
#
# WHY POST-MERGE AND NOT ON THE PR: this is the one deliberate exception to the
# repo's "the PR is the only full gate" rule. A mutation run costs ~20 minutes,
# which is a real tax on every PR touching the core, and unlike the other layers
# it does not answer "is this change correct?" — it answers "is the test suite
# still adversarial enough?". That question tolerates being answered minutes
# later, on main, because the fix is to add a test, not to revert the merge.
# Every other layer (contract, snapshot, public-API, arch, integration, e2e)
# stays on the PR. Consequence, accepted: main can go red on mutation score, and
# nothing blocks a merge on it — a failure here is a notification, not a gate.
# The `notify` job below is what makes that notification durable instead of a
# grey X nobody opens. Run it on demand before a risky merge via
# workflow_dispatch.
#
# Note this removes a signal, not a gate: the repo's `main` ruleset requires
# only `Build & test`, `Brief freshness`, `dependency-review` and
# `Analyze (csharp)` — the Stryker contexts were never required, so mutation
# never blocked a merge even while it ran on the PR.
on:
  push:
    branches:
      - main
    paths:
      - 'src/MMLib.Alvo/**'
      - 'src/MMLib.Alvo.Data.EntityFrameworkCore/**'
      - 'src/MMLib.Alvo.Data.Sqlite/**'
      - 'src/MMLib.Alvo.Data.PostgreSql/**'
      - 'stryker-config.json'
      - 'stryker-config.expressions.json'
      - 'stryker-config.data-ef-core.json'
      - 'stryker-config.data-ef-rest.json'
      - 'stryker-config.data-sqlite.json'
      - 'stryker-config.data-postgresql.json'
      - 'stryker-config.canary.json'
      # The test projects belong in the filter too: mutation judges the test
      # suite, so deleting or loosening an adversarial test drops the score
      # without touching src/. Post-merge is now the only run that can catch it.
      - 'test/MMLib.Alvo.Tests/**'
      - 'test/MMLib.Alvo.Data.EntityFrameworkCore.Tests/**'
      - 'test/MMLib.Alvo.Data.Sqlite.Tests/**'
      - 'test/MMLib.Alvo.Data.PostgreSql.Tests/**'
      # The canary leg's suite, and the shared sources every leg's suite compiles.
      # test/_shared/mutation/** is what makes a run's verdict honest at all (#142):
      # break it and every leg reports 100 % again, which is the failure this filter
      # must not let land unrun.
      - 'test/MMLib.Alvo.Abstractions.Tests/**'
      - 'test/_shared/**'
      # And the file that LINKS test/_shared/mutation/*.cs into every test project.
      # Deleting that ItemGroup turns the fix off everywhere, which is the same
      # failure as deleting the sources and just as invisible.
      - 'test/Directory.Build.props'
      # And so does the SHIPPED half of those suites, which lives under src/ and
      # not test/: MMLib.Alvo.Testing carries AlvoDataAdversarialTests,
      # AlvoDataStatementTests, AlvoDataDifferentialTests, AlvoDataComparisonTests
      # and AlvoDataOrderingTests, and its relational companion
      # MMLib.Alvo.Testing.EntityFrameworkCore carries AlvoSqlDialectContractTests
      # — the inherited facts that kill mutants in data-ef and in both drivers.
      # Loosening one of those drops the score of three configs, and without these
      # entries it would do so with no workflow run at all: exactly the hole
      # listing the test projects above exists to close. Both halves are listed,
      # because what separates them is a dependency boundary, not a coverage one.
      - 'src/MMLib.Alvo.Testing/**'
      - 'src/MMLib.Alvo.Testing.EntityFrameworkCore/**'
      # And what DECIDES what this gate checks, on the same principle
      # .husky/task-runner.json already applies to the local gate. Breaking the
      # guard or the workflow must trigger a run, or the breakage lands unrun.
      # stryker-config.api.json is deliberately NOT here: no matrix leg reads it (see
      # DECLARED GAP above), so a change to it would start a multi-hour run that cannot
      # exercise it. stryker-config.canary.json WAS excluded on that same rule and is
      # now listed above, because the canary has a leg.
      - '.github/workflows/mutation.yml'
      - 'scripts/assert-mutation-run'
      # scripts/mutation-notify is deliberately NOT here, on the same rule as
      # stryker-config.api.json above and for a sharper version of the same reason: a
      # matrix that SUCCEEDS never runs `notify`, so a push touching only that script
      # would start the whole multi-hour matrix and still not execute the changed
      # line. What does exercise it is scripts/test-mutation-notify, in ci.yml's
      # `Script suites` job, in seconds — and that folds into the required
      # `Build & test`.
  workflow_dispatch:

permissions:
  contents: read

# Key the group on the COMMIT, not the ref. On main every merge commit deserves
# its own verdict, and a ref-keyed group cannot deliver that even with
# cancel-in-progress off: GitHub keeps at most one pending run per group, so a
# third merge landing during a long run cancels the second one as
# superseded — dropping exactly the commit whose score you needed, as a grey
# "cancelled" nobody reads.
concurrency:
  group: mutation-${{ github.sha }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    # PER-SHARD, ON PURPOSE. A single workflow-wide budget cannot tell "this shard grew"
    # from "this shard was always the expensive one", and a silently rising global number
    # hides the growth curve the timeouts on run 30292141967 made visible. Each leg
    # therefore carries its own `timeout` with the mutant count it was sized against, and
    # the cheap legs keep a tight one so a regression there still trips.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The security core is sharded by `mutate` glob, not because one shard is a
          # meaningful unit, but because wall-clock is this gate's whole cost: with
          # coverage-analysis off every mutant reruns the full test project, so time is
          # mutants × suite. `Expressions/**` in one leg, everything except `Api/**` in the
          # other, and `Api/**` in neither — see DECLARED GAP in the header.
          #
          # `mutants:` and `suite:` below are MEASURED counts, not estimates — they size
          # the budget and they are what checks 3 and 4 of scripts/assert-mutation-run
          # take their floors from. RE-PROBED 2026-09-10 (discovery only, from `test/`),
          # because every one of them had gone stale since 2026-08-02 and check 3's floor
          # is one-sided, so growth reported nothing: data-ef had reached 1108 mutants
          # against a budget sized for 596, and rules/auth/rest 1638 against 657. Re-probe
          # a leg the moment it starts timing out, and re-probe ALL of them when one does
          # — the stale set is what made #205 look like one shard's problem.
          #
          # `timeout:` is now sized from MEASURED WALL CLOCK rather than from the mutant
          # count; the table in the header carries each measurement and its source.
          #
          # THE CANARY GOES FIRST, and only it carries `canary:` — the other legs leave the
          # key undefined, which `${{ matrix.canary }}` renders as the empty string that
          # scripts/assert-mutation-run's optional 6th argument accepts. It is first
          # because its answer is known in advance (0 killed, by construction), so a kill
          # here says every other leg's number on this run is measured through a defect
          # rather than through the mutants. See THE CANARY in the header.
          - name: canary
            config: stryker-config.canary.json
            project: src/MMLib.Alvo.Testing/MMLib.Alvo.Testing.csproj
            mutants: 13
            suite: 142
            timeout: 10     # measured ~20 s warm; the margin is cold checkout, setup-dotnet,
                            # `dotnet tool restore` and Stryker's own build, none of which this
                            # workflow caches. A timed-out job is CANCELLED, which uploads no log
                            # and still files a tracking issue, so the tight-budget rule the other
                            # legs follow is the wrong trade on the one leg that must be believed.
            canary: canary
          - name: security core (expressions)
            config: stryker-config.expressions.json
            project: src/MMLib.Alvo/MMLib.Alvo.csproj
            mutants: 900
            suite: 1185     # same test project as the leg below, so the two must be equal
            timeout: 90     # measured 27 and 31 min on two runs; 180 was 6x the real cost
          - name: security core (rules, auth, rest)
            config: stryker-config.json
            project: src/MMLib.Alvo/MMLib.Alvo.csproj
            mutants: 1638
            suite: 1185
            timeout: 120    # measured 41-47 min; +149 % mutants since calibration, next to run out
          # THE TWO HALVES OF THE OLD data-ef LEG. Split by test project, not by file —
          # see "WHY data-ef IS TWO LEGS" in the header for the measurement that decided
          # it, the rule that decides which leg a file lands on, and what the split does
          # NOT prove. 543 + 565 = 1108, the single leg's count: same mutant set, and
          # scripts/test-assert-mutation-run asserts the two configs stay its partition.
          - name: data-ef-core
            config: stryker-config.data-ef-core.json
            project: src/MMLib.Alvo.Data.EntityFrameworkCore/MMLib.Alvo.Data.EntityFrameworkCore.csproj
            mutants: 543
            suite: 1135     # two test projects — the only leg that pays for a second one
            timeout: 120    # ~55 min at the 24.3 s/mutant measured on run 33593316805
          - name: data-ef-rest
            config: stryker-config.data-ef-rest.json
            project: src/MMLib.Alvo.Data.EntityFrameworkCore/MMLib.Alvo.Data.EntityFrameworkCore.csproj
            mutants: 565
            suite: 554      # one test project
            timeout: 120    # <=57 min: an UPPER BOUND at the two-assembly rate, since the
                            # saving from dropping the second assembly was not measured
          - name: data-sqlite
            config: stryker-config.data-sqlite.json
            project: src/MMLib.Alvo.Data.Sqlite/MMLib.Alvo.Data.Sqlite.csproj
            mutants: 44
            suite: 581
            timeout: 30     # measured 7 min
          - name: data-postgresql
            config: stryker-config.data-postgresql.json
            project: src/MMLib.Alvo.Data.PostgreSql/MMLib.Alvo.Data.PostgreSql.csproj
            mutants: 20
            suite: 110
            timeout: 30     # measured 2 min
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Fails the shard rather than skipping it. This step used to set run=false and
      # let every later step skip, which reported the leg as SUCCESS — a shard that
      # measured nothing looking exactly like a shard that measured everything, and
      # `notify` never firing because the matrix result was 'success'. That guard made
      # sense while the mutated projects were still being created one at a time; all
      # of them exist now, so a missing csproj means a rename that silently retired a
      # leg, which is precisely the failure this workflow exists to make loud.
      - name: Guard — mutated project must exist
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.name }}
        run: |
          if [ ! -f "$PROJECT" ]; then
            echo "::error::Mutation run ($SHARD) has no project at '$PROJECT'. If it was renamed or moved, update the matrix; a shard that cannot find its project must not report success."
            exit 1
          fi

      - name: Restore tools
        run: dotnet tool restore

      - name: Mutation test
        shell: bash
        # From `test/`, NOT the repo root: with MMLib.Alvo.slnx in the working directory
        # Stryker enters solution mode and ignores each config's `test-projects`, running
        # every test project that references the mutated assembly (measured: 2211 tests
        # instead of 722 for the expressions shard, Testcontainers integration suites
        # included). The header comment has the numbers. Hence `../<config>` too.
        working-directory: test
        env:
          CONFIG: ../${{ matrix.config }}
          MUTANTS: ${{ matrix.mutants }}
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.name }}
          # Empty for every leg but the canary — see the matrix comment.
          CANARY: ${{ matrix.canary }}
        run: |
          # `shell: bash` means `bash -eo pipefail`, so the pipeline below would abort
          # the whole step the moment Stryker exits non-zero — before the assertions
          # run. Turn -e off around it and take the exit code by hand, so that a run
          # which measured the WRONG THING is diagnosed as that rather than as a low
          # score. `|| true` would not do: it clobbers PIPESTATUS.
          #
          # --concurrency: Stryker defaults to half the logical cores, i.e. 2 test runners on a
          # GitHub-hosted 4-vCPU runner, leaving half the machine idle for a run whose whole cost
          # is wall-clock. The runner has ~16 GB, comfortably more than four MTP hosts need for
          # this suite. Set on the command line rather than in the config so this reasoning has
          # somewhere to live — the config files are strict JSON with nowhere to put a comment.
          set +e
          dotnet tool run dotnet-stryker -f "$CONFIG" --concurrency 4 2>&1 | tee stryker-output.log
          stryker_exit="${PIPESTATUS[0]}"
          set -e

          # Did this run MEASURE what the config asked for? Four positive assertions —
          # vacuity, the test-project count, a floor on the mutant count and a floor on
          # the suite size — live in scripts/assert-mutation-run so they can be run over
          # a saved log by hand, which is how they were verified
          # (scripts/test-assert-mutation-run). Read that script's header before
          # changing any of them; in particular it records WHY the solution-mode check
          # is the test-project count and not the mutant count (measured: solution mode
          # leaves the mutant count identical and moves only the test count).
          ../scripts/assert-mutation-run \
            stryker-output.log "$CONFIG" "$MUTANTS" "$SUITE" "$SHARD" "$CANARY"

          exit "$stryker_exit"

      # The tracking issue tells whoever reads it to open the log to tell a vacuous run
      # from a below-threshold score. Until now that log existed only in the job console,
      # which is not linkable from an issue and is truncated for a long run — so upload it.
      # `always()` so it survives the shard failing, which is the only case anyone wants it.
      #
      # WHAT THIS DOES NOT COVER, deliberately stated: a shard killed by `timeout-minutes`
      # is CANCELLED, and a cancelled job does not run its remaining steps, `always()`
      # included. So the one outcome with no verdict at all — #98's whole subject — is also
      # the one whose log is not captured here. Nothing short of streaming the log
      # elsewhere fixes that, and it is not worth it: a timeout needs the shard's budget
      # looked at, not its log read.
      - name: Upload the Stryker log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-log-${{ matrix.name }}
          path: test/stryker-output.log
          if-no-files-found: ignore
          retention-days: 30

  # Post-merge, nothing blocks on this workflow, so a failure has to leave a mark
  # somebody trips over. Without this the only signal is GitHub's default email to
  # whoever clicked merge — which is precisely how a quietly-rotting main happens.
  # ONE TRACKING ISSUE PER COMMIT. An earlier version keyed it on the `mutation-gate`
  # label alone — "one open issue at a time, later failures comment on it rather than
  # spawning a pile" — and that turned out to be the "grey X nobody opens" problem one
  # level up: three consecutive main commits (b62176d0, e1ec3a6e, 83afbbfb) landed as
  # three comments on a ten-day-old #181, where they read as an old known problem
  # rather than as news about this commit. The title now carries the ref and the short
  # sha, so a new commit opens its own issue and a re-run of the same commit comments
  # on that commit's. scripts/mutation-notify owns the routing.
  notify:
    name: Report a failed mutation run
    needs: mutation
    # NOT `failure()`. A job killed by `timeout-minutes` ends with conclusion
    # `cancelled`, so `failure()` is false and this job was SKIPPED for the one
    # outcome that is worse than a low score: a run that produced no verdict at
    # all. That is what happened to run 30292141967 (#98) — three shards hit the
    # 120-minute budget and nobody was told. `always()` plus an explicit result
    # check covers failure, timeout and cancellation alike.
    # Accepted cost: a human cancelling a run by hand now also files a report.
    # That is the same "no verdict" state, it is cheap to close, and it is
    # strictly better than a silent timeout. (The concurrency group is keyed on
    # the commit with cancel-in-progress off, so GitHub itself never cancels one
    # of these runs as superseded.)
    #
    # workflow_dispatch IS INCLUDED, and the earlier `github.event_name == 'push'`
    # was a hole: CLAUDE.md prescribes an on-demand run before a risky
    # security-core merge, which is precisely the run whose outcome someone is
    # waiting on — and it notified nothing. Both triggers are still named
    # explicitly rather than collapsed to `always()`, so adding a trigger to `on:`
    # later is a conscious decision about whether it should file issues.
    if: >-
      always()
      && needs.mutation.result != 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # To read this run's PER-LEG job conclusions: `needs.mutation.result`
      # collapses every shard into one word, and the three failure shapes
      # below want telling apart, which needs the individual conclusions.
      actions: read
    steps:
      # The notify job needs a checkout now that its logic is a script in the repo.
      # It was checkout-free while the logic was inline YAML; that is the trade for
      # making the one code path that only runs on failure testable.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or update the tracking issue
        # EVERY `${{ }}` GOES THROUGH `env:`, none into the `run:` body. `ref_name`
        # in particular is attacker-influenced — anyone who can open a PR can name a
        # branch — and interpolating it into a shell line would be an injection on the
        # one code path that is only ever exercised when something is already wrong.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.mutation.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        # The logic lives in scripts/mutation-notify, not inline here, because it
        # only ever executes in the failure case: inline YAML cannot be run against
        # a stubbed `gh`, a script can, and scripts/test-mutation-notify does. That
        # is not a hypothetical — #98 was a one-line defect on this exact path and
        # it survived a month because nothing exercised it.
        run: |
          scripts/mutation-notify \
            "$REPO" "$SHA" "$RUN_ID" "$RUN_URL" \
            "$MATRIX_RESULT" "$EVENT_NAME" "$REF_NAME"
