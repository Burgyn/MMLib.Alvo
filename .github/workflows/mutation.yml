name: Mutation

# Mutation testing of the security-relevant logic. Path-filtered so it runs only
# when a mutated project changes. Five targets run in parallel via a matrix:
#   - "security core (expressions)"       → src/MMLib.Alvo/Expressions/**
#                        (stryker-config.expressions.json)
#   - "security core (rules, auth, rest)" → the rest of src/MMLib.Alvo
#                        (stryker-config.json). The two globs partition the project
#                        exactly; see the matrix for why it is sharded at all.
#   - "data-ef"        → the EF provider's PURE-LOGIC only: DestructiveScan,
#                        RenamePrePass, RenameGuessSplitter, DescriptorModelBuilder,
#                        AlvoSqlIdentifier, and the data path's Internal/* composers
#                        (stryker-config.data-ef.json). The EF project's
#                        transaction/DB-round-trip code is deliberately excluded —
#                        its defects only manifest against a real database, so
#                        mutation there is noise; it's covered by the SQLite +
#                        PostgreSQL integration tests instead. Internal/AlvoDataSeed.cs
#                        is excluded for a different reason: it is the test-only
#                        seeding seam, so mutating it measures the harness, not the
#                        product. This target's test-projects list BOTH the EF
#                        package's own tests and MMLib.Alvo.Data.Sqlite.Tests, since
#                        the killing tests for EfAlvoData, SortSqlRenderer,
#                        UpdateSetterFactory and WritePropertyBag live in the latter.
#                        Measured per-config mutant counts, the two Safe-Mode blind
#                        spots and the known survivors are recorded in
#                        docs/architecture/data-path.md ("Mutation-testing notes").
#   - "data-sqlite"    → src/MMLib.Alvo.Data.Sqlite     (stryker-config.data-sqlite.json)
#   - "data-postgresql"→ src/MMLib.Alvo.Data.PostgreSql (stryker-config.data-postgresql.json)
#
# The two driver targets exist because F3 PR2 moved security-relevant RENDERING into
# them: the boolean literal that lands inside a policy WHERE clause (TrueLiteral /
# FalseLiteral), whether an identifier is quoted at all (RenderField / RenderColumn /
# RenderTable), the case-insensitive LIKE shape, and the row-lock clause the WITH CHECK
# pre-image read depends on. Before that they held only registration and plumbing, so
# neither had a config. Mutating `TrueLiteral => "1"` to `"0"` inverts a security
# predicate, and the only other thing pinning those values is an accepted Verify
# baseline — the one artefact that can be made green with no product-code change.
# Each driver's registration surface (the UseXxx builder extensions and its Options
# POCO) is excluded for the same reason AlvoEfCoreProvider.cs is: it is DI wiring,
# proven by the AddAlvo integration tests, and mutating it only produces survivors.
# Both run against the driver's FAST unit test project — MMLib.Alvo.Data.PostgreSql.Tests,
# not the Testcontainers-backed .Tests.Integration project, which self-skips off Linux
# and would make the run depend on Docker.
#
# Each config pins `test-runner: mtp` + `coverage-analysis: off` because Stryker
# 4.16's default VSTest runner cannot discover tests in xUnit v3 / Microsoft.Testing.Platform
# projects (our primary runner — see global.json) and its per-test coverage capture
# under MTP is preview-quality and reports false "NoCoverage" (stryker-net#3094).
# The "Mutation test" step below fails loudly on a vacuous (zero-mutant) run
# instead of reporting a false green.
#
# WHY POST-MERGE AND NOT ON THE PR: this is the one deliberate exception to the
# repo's "the PR is the only full gate" rule. A mutation run costs ~20 minutes,
# which is a real tax on every PR touching the core, and unlike the other layers
# it does not answer "is this change correct?" — it answers "is the test suite
# still adversarial enough?". That question tolerates being answered minutes
# later, on main, because the fix is to add a test, not to revert the merge.
# Every other layer (contract, snapshot, public-API, arch, integration, e2e)
# stays on the PR. Consequence, accepted: main can go red on mutation score, and
# nothing blocks a merge on it — a failure here is a notification, not a gate.
# The `notify` job below is what makes that notification durable instead of a
# grey X nobody opens. Run it on demand before a risky merge via
# workflow_dispatch.
#
# Note this removes a signal, not a gate: the repo's `main` ruleset requires
# only `Build & test`, `Brief freshness`, `dependency-review` and
# `Analyze (csharp)` — the Stryker contexts were never required, so mutation
# never blocked a merge even while it ran on the PR.
on:
  push:
    branches:
      - main
    paths:
      - 'src/MMLib.Alvo/**'
      - 'src/MMLib.Alvo.Data.EntityFrameworkCore/**'
      - 'src/MMLib.Alvo.Data.Sqlite/**'
      - 'src/MMLib.Alvo.Data.PostgreSql/**'
      - 'stryker-config.json'
      - 'stryker-config.expressions.json'
      - 'stryker-config.data-ef.json'
      - 'stryker-config.data-sqlite.json'
      - 'stryker-config.data-postgresql.json'
      # The test projects belong in the filter too: mutation judges the test
      # suite, so deleting or loosening an adversarial test drops the score
      # without touching src/. Post-merge is now the only run that can catch it.
      - 'test/MMLib.Alvo.Tests/**'
      - 'test/MMLib.Alvo.Data.EntityFrameworkCore.Tests/**'
      - 'test/MMLib.Alvo.Data.Sqlite.Tests/**'
      - 'test/MMLib.Alvo.Data.PostgreSql.Tests/**'
  workflow_dispatch:

permissions:
  contents: read

# Key the group on the COMMIT, not the ref. On main every merge commit deserves
# its own verdict, and a ref-keyed group cannot deliver that even with
# cancel-in-progress off: GitHub keeps at most one pending run per group, so a
# third merge landing during a long run cancels the second one as
# superseded — dropping exactly the commit whose score you needed, as a grey
# "cancelled" nobody reads.
concurrency:
  group: mutation-${{ github.sha }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The security-core run outgrew a 40-minute budget the moment F3's PR1 landed the CEL
    # compiler, both rule backends and the policy engine: it was cancelled at exactly 40:00
    # with the run still in progress, which reads as a grey "cancelled" rather than as a
    # verdict — the same silent-non-answer this workflow's own fail-loud step exists to
    # prevent. Nothing waits on this run (it is post-merge, or dispatched on demand), so the
    # budget is generous on purpose; a genuinely hung run still ends, just later.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The security core is sharded by `mutate` glob, not because one shard is a
          # meaningful unit, but because wall-clock is this gate's whole cost: with
          # coverage-analysis off every mutant reruns the full test project, so time is
          # mutants × suite, and F3's PR1 pushed that past two hours in one job. The two
          # globs partition src/MMLib.Alvo exactly — `Expressions/**` in one, everything
          # else in the other — so a file cannot be mutated twice or silently skipped. The
          # expressions shard is the CEL lexer/parser/checker/interpreter/renderer, which is
          # both the densest in mutants and the one whose score matters most.
          - name: security core (expressions)
            config: stryker-config.expressions.json
            project: src/MMLib.Alvo/MMLib.Alvo.csproj
          - name: security core (rules, auth, rest)
            config: stryker-config.json
            project: src/MMLib.Alvo/MMLib.Alvo.csproj
          - name: data-ef
            config: stryker-config.data-ef.json
            project: src/MMLib.Alvo.Data.EntityFrameworkCore/MMLib.Alvo.Data.EntityFrameworkCore.csproj
          - name: data-sqlite
            config: stryker-config.data-sqlite.json
            project: src/MMLib.Alvo.Data.Sqlite/MMLib.Alvo.Data.Sqlite.csproj
          - name: data-postgresql
            config: stryker-config.data-postgresql.json
            project: src/MMLib.Alvo.Data.PostgreSql/MMLib.Alvo.Data.PostgreSql.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Guard — mutated project must exist
        id: guard
        run: |
          if [ -f "${{ matrix.project }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Project ${{ matrix.project }} not present — skipping mutation."
          fi

      - name: Restore tools
        if: steps.guard.outputs.run == 'true'
        run: dotnet tool restore

      - name: Mutation test
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          # --concurrency: Stryker defaults to half the logical cores, i.e. 2 test runners on a
          # GitHub-hosted 4-vCPU runner, leaving half the machine idle for a run whose whole cost
          # is wall-clock. The runner has ~16 GB, comfortably more than four MTP hosts need for
          # this suite. Set on the command line rather than in the config so this reasoning has
          # somewhere to live — the config files are strict JSON with nowhere to put a comment.
          dotnet tool run dotnet-stryker -f "${{ matrix.config }}" --concurrency 4 2>&1 | tee stryker-output.log
          stryker_exit="${PIPESTATUS[0]}"

          # Fail loud instead of showing a false green: a run that discovered
          # or tested zero mutants is not a passing run, it's a broken one.
          # See stryker-net#3094 — Stryker's VSTest-based runner can regress
          # to this on an xUnit v3 / MTP test project even with `test-runner:
          # mtp` configured (e.g. a tool upgrade, or a new test project that
          # isn't MTP-compatible).
          if grep -qE '0 total mutants will be tested|unable to calculate a mutation score|Number of tests found: 0' stryker-output.log; then
            echo "::error::Mutation run (${{ matrix.name }}) tested zero mutants (vacuous run) — see stryker-output.log above. Failing the gate instead of a false green (stryker-net#3094)."
            exit 1
          fi

          exit "$stryker_exit"

  # Post-merge, nothing blocks on this workflow, so a failure has to leave a mark
  # somebody trips over. Without this the only signal is GitHub's default email to
  # whoever clicked merge — which is precisely how a quietly-rotting main happens.
  # One open tracking issue at a time: later failures comment on it rather than
  # spawning a pile.
  notify:
    name: Report a failed mutation run
    needs: mutation
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          The post-merge mutation run failed for \`$SHA\`.

          Run: $RUN_URL

          Mutation runs post-merge by design, so this did not block the merge —
          it needs someone to act. Two shapes of failure:

          - **Mutation score below threshold** — the adversarial suite stopped
            biting. The fix is to add or strengthen a test, not to revert.
          - **Vacuous run (zero mutants tested)** — the gate itself is broken
            (see stryker-net#3094). That is more urgent than a low score: it
            means the previous greens were meaningless.
          EOF
          )"

          # The label may not exist yet; creating it must not fail the job.
          gh label create mutation-gate \
            --repo "$REPO" \
            --description "Post-merge mutation run needs attention" \
            --color B60205 2>/dev/null || true

          existing="$(gh issue list --repo "$REPO" --state open \
            --label mutation-gate --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" \
              --title "Mutation gate failed on main" \
              --label mutation-gate \
              --body "$body"
          fi
