name: Image

# The standalone image, ghcr.io/burgyn/alvo. This workflow is the ONLY thing that publishes it —
# release.yml owns the NuGet packages and nothing else.
#
#   pull_request touching the image's inputs → build one arch, smoke-test it, push nothing
#   push to main                             → smoke-test, then :edge and :sha-<7>, amd64 + arm64
#   push of a v* tag                         → smoke-test, then :<major>.<minor>.<patch>,
#                                              :<major>.<minor> and :latest, amd64 + arm64
#
# The smoke test is scripts/test-quickstart over docker-compose.quickstart.yml — the no-clone quick
# start exactly as a reader runs it, with only the image swapped. It runs over the linux/amd64 build
# of the commit, and the publish job runs only if it passed: reaching /health/ready, authenticating
# the demo key, signing in to the dashboard. What is pushed is a two-arch REBUILD of the same commit
# from the same GHA cache, not the tested artifact itself, and arm64 is never run in CI. Not folded into the required "Build & test" check: ci.yml's e2e job already builds the
# same Dockerfile on every PR, and this one is paths-filtered.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'schema/**'
      - 'examples/**'
      - '.claude/skills/alvo-descriptor-*/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'MMLib.Alvo.slnx'
      - '.dockerignore'
      - 'docker-compose.quickstart.yml'
      - 'scripts/test-quickstart'
      - '.github/workflows/image.yml'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Never cancel a publish half-way (a tag push and a main push must both land); a newer PR push may
# replace an older PR run.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/burgyn/alvo

jobs:
  smoke:
    name: Build & smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # minver reads the tags and the height above them.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The build context carries no .git, so the Dockerfile cannot discover its version (see its
      # ARG VERSION). minver-cli at the same major as the MinVer package (Directory.Packages.props)
      # and with the same tag prefix (Directory.Build.props) derives the version the NuGet packages
      # of the same commit carry: 0.1.0 on v0.1.0, 0.1.1-alpha.0.<height> after it.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          dotnet tool install minver-cli --version 8.0.0 --tool-path "$RUNNER_TEMP/minver" >/dev/null
          version="$("$RUNNER_TEMP/minver/minver" --tag-prefix v --verbosity warn)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Image version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # One arch, loaded into the local daemon: the smoke test runs the image, and a multi-arch build
      # cannot be loaded. The publish job rebuilds both arches from the same cache.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/MMLib.Alvo.Host/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: alvo:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=alvo-image
          cache-to: type=gha,scope=alvo-image,mode=max

      - name: Quick start against the built image
        env:
          ALVO_IMAGE: alvo:smoke
        run: bash scripts/test-quickstart

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    name: Publish to ghcr.io
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The one job that may write packages; everything else in this workflow reads.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # main → edge + sha-<7>; v* → semver + latest. `latest=auto` adds latest only alongside a
      # semver tag that is not a pre-release, so a v0.2.0-rc.1 publishes :0.2.0-rc.1 and moves
      # neither :0.2 nor :latest.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # A v* tag that is not semver (vnext, v1) yields no tag at all, and build-push would fail only
      # after the whole two-arch build. Refuse it here instead, before QEMU is even set up.
      - name: Refuse a run with no tag to push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::'$GITHUB_REF_NAME' produced no image tag: a v* tag must be semver (v0.1.0, v0.2.0-rc.1)."
            exit 1
          fi
          printf 'Publishing:\n%s\n' "$TAGS"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels come from the Dockerfile alone (one authority); the index-level annotations repeat
      # the three GitHub's package page reads from a multi-arch index, where image labels are not seen.
      # provenance + sbom attach BuildKit's attestations to the pushed image.
      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/MMLib.Alvo.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/Burgyn/MMLib.Alvo
            index:org.opencontainers.image.description=Alvo standalone host: a .NET Backend-as-a-Service driven by one JSON descriptor.
            index:org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ needs.smoke.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=alvo-image
          cache-to: type=gha,scope=alvo-image,mode=max
