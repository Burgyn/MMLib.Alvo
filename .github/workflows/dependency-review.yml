name: "Dependency Review"

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          # Npgsql ships under the PostgreSQL License — OSI-approved, permissive, and
          # Apache-2.0-compatible, but not one of the five above. It is named here rather
          # than added to `allow-licenses` deliberately: the exception is this package, not
          # the licence family, so a future dependency under the same licence still stops
          # a PR and gets read.
          #
          # The package is not new. `MMLib.Alvo.Data.PostgreSql` has referenced it since
          # the engine landed; the host's reference became DIRECT in the PR that added the
          # database selector, and dependency-review inspects changed edges, so an existing
          # licence surfaced as a new finding.
          #
          # The npm entries below are the documentation site's build tooling (`website/`,
          # driven by `website/package-lock.json`). None of them is shipped: no NuGet package
          # and not the container image (`.dockerignore` excludes `website/` and `tools/`)
          # contains a byte of them; they run on a CI runner to turn Markdown into static
          # HTML. Each is named per package, by the same rule as Npgsql above:
          #   - lightningcss, lightningcss-<platform>: MPL-2.0 (Astro/Vite's CSS minifier).
          #   - @img/sharp-libvips-<platform>, @img/sharp-win32-<arch>, @img/sharp-wasm32:
          #     LGPL-3.0-or-later (libvips binaries behind sharp, Astro's image pipeline).
          #   - lru-cache, sax, common-ancestor-path: BlueOak-1.0.0 (permissive).
          #   - mdn-data: CC0-1.0 (public-domain CSS data, via css-tree).
          #   - argparse: Python-2.0 (permissive; js-yaml's CLI parser).
          #   - tslib: 0BSD; robust-predicates: Unlicense (both public-domain-equivalent).
          #   - @fortawesome/fontawesome-free: CC-BY-4.0 AND OFL-1.1 AND MIT (the icon
          #     font mermaid-isomorphic loads into its build-time headless renderer).
          #   - lodash-es: CC0-1.0 AND MIT, as the dependency graph reports it (Mermaid's
          #     utility library).
          # The list is what GitHub's dependency graph reports for this lockfile — the data the
          # action reads, which differs from the lockfile's own licence fields in places. Only
          # runtime-scope packages are licence-checked (`fail-on-scopes` defaults to runtime), so
          # the site's dev-only check tooling (axe-core, MPL-2.0) needs no entry.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout,
            pkg:githubactions/actions/dependency-review-action,
            pkg:nuget/Npgsql.EntityFrameworkCore.PostgreSQL,
            pkg:npm/lightningcss,
            pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64,
            pkg:npm/lru-cache,
            pkg:npm/sax,
            pkg:npm/common-ancestor-path,
            pkg:npm/mdn-data,
            pkg:npm/argparse,
            pkg:npm/tslib,
            pkg:npm/robust-predicates,
            pkg:npm/%40fortawesome/fontawesome-free,
            pkg:npm/lodash-es
