# Saved as docker-compose.override.yml in the clone root, it replaces the one from "Run your own descriptor"
# and keeps its keys. Key 3, reader, may read every entity and write none: its scopes hold "*:read" only.
services:
  alvo:
    environment:
      Alvo__Auth__DevKeys__1__KeyId: agent
      Alvo__Auth__DevKeys__1__Secret: ${ALVO_AGENT_KEY_SECRET:?set ALVO_AGENT_KEY_SECRET before starting the stack}
      Alvo__Auth__DevKeys__1__User: 3f2b8c1e-7a4d-4e9b-9c21-5d6e7f8a9b01
      Alvo__Auth__DevKeys__1__Roles__0: agent
      Alvo__Auth__DevKeys__1__Roles__1: authenticated
      Alvo__Auth__DevKeys__1__Scopes__0: "*:read"
      Alvo__Auth__DevKeys__1__Scopes__1: "*:write"
      Alvo__Auth__DevKeys__2__KeyId: admin
      Alvo__Auth__DevKeys__2__Secret: ${ALVO_ADMIN_KEY_SECRET:?set ALVO_ADMIN_KEY_SECRET before starting the stack}
      Alvo__Auth__DevKeys__2__User: 8d4e2a6c-1b3f-4c5d-8e7a-9f0b1c2d3e02
      Alvo__Auth__DevKeys__2__Roles__0: admin
      Alvo__Auth__DevKeys__2__Roles__1: authenticated
      Alvo__Auth__DevKeys__2__Scopes__0: "*:read"
      Alvo__Auth__DevKeys__2__Scopes__1: "*:write"
      Alvo__Auth__DevKeys__3__KeyId: reader
      Alvo__Auth__DevKeys__3__Secret: ${ALVO_READER_KEY_SECRET:?set ALVO_READER_KEY_SECRET before starting the stack}
      Alvo__Auth__DevKeys__3__User: 5a1d0c3e-2f4b-4a6c-9d8e-7f6a5b4c3d03
      Alvo__Auth__DevKeys__3__Roles__0: agent
      Alvo__Auth__DevKeys__3__Roles__1: authenticated
      Alvo__Auth__DevKeys__3__Scopes__0: "*:read"
      Alvo__Admin__BootstrapEmail: admin@example.com
      Alvo__Admin__BootstrapPasswordFile: /run/secrets/alvo_admin_password
    secrets:
      - alvo_admin_password

secrets:
  alvo_admin_password:
    file: ./.alvo-admin-password
